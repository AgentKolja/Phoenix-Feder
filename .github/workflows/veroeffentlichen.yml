# Baut die Seite bei jedem Push auf main und veroeffentlicht sie ueber GitHub Pages.
# Einmalig noetig: Settings -> Pages -> Source: "GitHub Actions".
# Schlaegt der Build fehl (z. B. kaputter Link), bleibt die bisherige Version online.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 bauen.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
