<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Werbung Achtsamkeitsseminar</title>
<style>
@font-face { font-family: "Source Serif 4"; src: url("{{wurzel}}/schriften/source-serif-4.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "Source Serif 4"; src: url("{{wurzel}}/schriften/source-serif-4-italic.woff2") format("woff2"); font-weight: 200 900; font-style: italic; }
@font-face { font-family: "Source Sans 3"; src: url("{{wurzel}}/schriften/source-sans-3.woff2") format("woff2"); font-weight: 300 700; }
:root {
  --grund: #fbf7f1; --flaeche: #f3eadd; --text: #2a211c; --leise: #6b5b4f;
  --akzent: #8f5418; --akzent-hell: #c8842f; --linie: #e5d8c7;
  --serif: "Source Serif 4", Georgia, serif; --sans: "Source Sans 3", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--grund); color: var(--text); font-family: var(--sans); }
.blatt { position: relative; overflow: hidden; background: var(--grund); }
.oberzeile { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--akzent); }
h1 { font-family: var(--serif); font-weight: 500; line-height: 1.06; letter-spacing: -0.01em; }
h1, .unter, .fakt span, .szene p { text-wrap: balance; }
.text { text-wrap: pretty; }
.unter { font-family: var(--serif); color: var(--akzent); }
.text { color: var(--leise); line-height: 1.4; }
.fakten { display: grid; }
.fakt { display: grid; grid-template-columns: auto 1fr; align-items: baseline; }
.fakt b { color: var(--akzent); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.fakt span { color: var(--text); line-height: 1.3; }
.fakt span i { font-style: normal; color: var(--leise); }
.anmelden { display: flex; align-items: center; background: #fff; border: 1px solid var(--linie); }
.anmelden .qr svg, .anmelden .qr img { display: block; width: 100%; height: 100%; }
.anmelden strong { display: block; font-family: var(--serif); font-weight: 500; color: var(--text); }
.anmelden .adresse { color: var(--akzent); font-weight: 700; }
.leiter { display: flex; align-items: center; }
.leiter img { border-radius: 50%; object-fit: cover; object-position: 50% 25%; }
.leiter span { color: var(--leise); }
.leiter strong { color: var(--text); font-weight: 600; }
.bogen { overflow: hidden; border-radius: 999px 999px 28px 28px; box-shadow: 0 20px 60px rgb(60 40 20 / 18%); }
.bogen img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.marke { position: absolute; color: var(--akzent); font-family: var(--serif); }

/* ---------- Instagram-Beitrag 1080 × 1350 und Story 1080 × 1920: wie das Plakat ---------- */
.post, .story, .reel { background: #fffdf9; }
.post, .story, .reel .ende { display: flex; flex-direction: column; }
.post > *:not(.kreis), .story > *:not(.kreis) { position: relative; }
.kreis { position: absolute; border-radius: 50%; overflow: hidden; }
/* Foto so in den Kreis gesetzt, dass im sichtbaren Teil (der Kreis ragt oben und rechts aus dem Bild)
   Ärmel, Unterarm und Hand ganz zu sehen sind; Werte in % der Kreisgröße, gelten für alle Formate */
.kreis img { position: absolute; width: 95%; height: auto; left: -5%; top: 38%; display: block; }
.post h1, .story h1, .reel h1 { font-family: var(--sans); font-weight: 700; line-height: 0.95; text-transform: uppercase; letter-spacing: -0.005em; text-wrap: initial; }
.post .unter, .story .unter, .reel .unter { line-height: 1.1; }
.post .unten, .story .unten, .reel .unten { margin-top: auto; border-top: solid var(--text); display: grid; }
.post .termin, .story .termin, .reel .termin { font-family: var(--sans); font-weight: 600; line-height: 1.12; color: var(--text); }
.post .infos, .story .infos, .reel .infos { font-family: var(--sans); line-height: 1.2; color: var(--text); }
.post .anmelden-qr, .story .anmelden-qr, .reel .anmelden-qr { display: flex; align-items: center; }
.post .qr, .story .qr, .reel .qr { flex: none; }
.post .anmelden-qr p, .story .anmelden-qr p, .reel .anmelden-qr p { font-family: var(--sans); line-height: 1.3; color: var(--text); }
.post .anmelden-qr strong, .story .anmelden-qr strong, .reel .anmelden-qr strong { color: var(--akzent); }
.post .klein, .story .klein, .reel .klein { display: block; color: var(--leise); }

.post { width: 1080px; height: 1350px; padding: 0 80px 64px; }
.post .kreis { width: 760px; height: 760px; right: -190px; top: -330px; }
.post h1 { margin-top: 440px; font-size: 98px; }
.post .unter { font-size: 64px; margin-top: 14px; }
.post .unten { padding-top: 26px; border-top-width: 4px; gap: 18px; }
.post .termin { font-size: 48px; }
.post .infos { font-size: 38px; }
.post .anmelden-qr { gap: 28px; }
.post .qr { width: 170px; height: 170px; }
.post .anmelden-qr p { font-size: 30px; }
.post .anmelden-qr strong { font-size: 35px; }
.post .klein { font-size: 26px; margin-top: 8px; }

.story, .reel { width: 1080px; height: 1920px; }
.story, .reel .ende { padding: 0 90px 150px; }
.story .kreis, .reel .kreis { width: 1000px; height: 1000px; right: -270px; top: -400px; }
.story h1, .reel .ende h1 { margin-top: 660px; font-size: 118px; }
.story .unter, .reel .ende .unter { font-size: 82px; margin-top: 24px; }
.story .unten, .reel .unten { padding-top: 40px; border-top-width: 5px; gap: 30px; }
.story .termin, .reel .ende .termin { font-size: 64px; }
.story .infos, .reel .ende .infos { font-size: 50px; }
.story .anmelden-qr, .reel .anmelden-qr { gap: 40px; }
.story .qr, .reel .qr { width: 250px; height: 250px; }
.story .anmelden-qr p, .reel .anmelden-qr p { font-size: 40px; }
.story .anmelden-qr strong, .reel .anmelden-qr strong { font-size: 46px; }
.story .klein, .reel .klein { font-size: 34px; margin-top: 12px; }

/* ---------- Link-Vorschau 1200 × 630 (WhatsApp, Social Media): wie das Plakat, Kreis rechts oben ---------- */
.vorschau { width: 1200px; height: 630px; padding: 64px 70px 54px; display: flex; flex-direction: column; background: #fffdf9; }
.vorschau > *:not(.kreis) { position: relative; }
.vorschau .kreis { width: 720px; height: 720px; right: -210px; top: -250px; }
/* im Querformat sitzt das Foto etwas höher im Kreis, damit oben keine Kante bleibt */
.vorschau .kreis img { top: 33%; }
.vorschau h1 { font-family: var(--sans); font-weight: 700; font-size: 80px; line-height: 0.95; text-transform: uppercase; letter-spacing: -0.005em; text-wrap: initial; }
.vorschau .unter { font-size: 60px; margin-top: 16px; line-height: 1.1; }
.vorschau .unten { margin-top: auto; padding-top: 20px; border-top: 4px solid var(--text); max-width: 640px; }
.vorschau .termin { font: 600 36px/1.15 var(--sans); color: var(--text); }
.vorschau .infos { font: 400 30px/1.25 var(--sans); color: var(--text); margin-top: 6px; }

/* ---------- Plakat DIN A4: sehr wenig Text, alles groß, ein Bild im Kreis ---------- */
@page { size: A4; margin: 0; }
.plakat { width: 210mm; height: 297mm; padding: 15mm 16mm 13mm; display: flex; flex-direction: column; background: #fffdf9; }
.plakat .kreis { position: absolute; width: 168mm; height: 168mm; right: -30mm; top: -80mm; border-radius: 50%; overflow: hidden; }
.plakat > *:not(.kreis):not(.stoerer):not(.absender) { position: relative; }
/* Absender oben links: füllt die Ecke neben dem Foto ruhig aus und macht die Marke erkennbar */
.plakat .absender { position: absolute; left: 16mm; top: 14mm; display: flex; align-items: center; gap: 2.5mm; font: 500 17pt/1 var(--serif); color: var(--text); }
.plakat .absender svg { width: 10mm; height: 10mm; }
/* Störer: runder Aufkleber mit dem Angebot, sitzt auf dem Rand des Fotokreises */
.plakat .stoerer { position: absolute; z-index: 2; left: 74mm; top: 40mm; width: 48mm; height: 48mm; border-radius: 50%;
  background: var(--akzent); color: #fffdf9; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; box-shadow: 0 1.5mm 5mm rgb(60 40 20 / 28%); border: 1.2mm solid #fffdf9; }
.plakat .stoerer strong { font: 700 19.5pt/1 var(--sans); text-transform: uppercase; letter-spacing: 0.03em; }
.plakat .stoerer span { font: 400 15pt/1.15 var(--sans); margin-top: 1.8mm; }
/* Schrift so groß, dass die Zeilen die Breite nutzen (Nikolas, Okt. 2026: „zu viel weiße Fläche“) */
.plakat h1 { margin-top: 77mm; font: 700 71pt/0.94 var(--sans); text-transform: uppercase; letter-spacing: -0.008em; text-wrap: initial; }
.plakat .unter { font-size: 56pt; margin: 3.5mm 0 6mm; line-height: 1.05; }
.plakat .unten { margin-top: auto; padding-top: 5mm; border-top: 0.8mm solid var(--text); display: grid; gap: 4mm; }
.plakat .termin { font: 600 42pt/1.08 var(--sans); color: var(--text); }
.plakat .infos { font: 400 31pt/1.18 var(--sans); color: var(--text); }
.plakat .anmelden-qr { display: flex; align-items: center; gap: 7mm; margin-top: 1mm; }
.plakat .qr { width: 47mm; height: 47mm; flex: none; }
.plakat .anmelden-qr p { font: 400 21pt/1.3 var(--sans); color: var(--text); }
.plakat .anmelden-qr strong { font-size: 25pt; color: var(--akzent); }
.plakat .anmelden-qr .klein { display: block; margin-top: 3mm; font-size: 17pt; color: var(--leise); }

/* ---------- Short 1080 × 1920 (Reel, WhatsApp-Status): vier ruhige Szenen im Plakat-Look, 12 s ---------- */
.reel .kreis img { animation: zoom 12s linear both; }
/* Szenen mittig im Raum unter dem Kreis; unten bleibt Platz für Instagram-Bildunterschrift und Knöpfe */
.reel .szene { position: absolute; left: 90px; right: 90px; top: 660px; bottom: 380px; display: flex; flex-direction: column; justify-content: center; opacity: 0; }
.reel .frage { font-family: var(--serif); font-weight: 500; font-size: 116px; line-height: 1.1; color: var(--text); }
.reel .s2 h1 { font-size: 124px; }
.reel .s2 .unter { font-size: 92px; margin-top: 28px; }
.reel .s3 .termin { font-size: 84px; }
.reel .s3 .infos { font-size: 66px; margin-top: 48px; }
.reel .ende { position: absolute; inset: 0; opacity: 0; padding-bottom: 330px; }
.reel .ende h1 { margin-top: 610px; }
.reel .ende .unter { margin-bottom: 44px; }
.post .unter, .story .unter { margin-bottom: 30px; }
.reel .s1 { animation: s1 12s linear both; }
.reel .s2 { animation: s2 12s linear both; }
.reel .s3 { animation: s3 12s linear both; }
.reel .ende { animation: ende 12s linear both; }
@keyframes zoom { from { transform: scale(1.0); } to { transform: scale(1.15); } }
@keyframes s1 { 0% { opacity: 0; transform: translateY(24px); } 4% { opacity: 1; transform: none; } 23% { opacity: 1; } 27% { opacity: 0; } 100% { opacity: 0; } }
@keyframes s2 { 0%, 26% { opacity: 0; transform: translateY(24px); } 30% { opacity: 1; transform: none; } 50% { opacity: 1; } 54% { opacity: 0; } 100% { opacity: 0; } }
@keyframes s3 { 0%, 53% { opacity: 0; transform: translateY(24px); } 57% { opacity: 1; transform: none; } 76% { opacity: 1; } 80% { opacity: 0; } 100% { opacity: 0; } }
@keyframes ende { 0%, 79% { opacity: 0; } 84% { opacity: 1; } 100% { opacity: 1; } }
</style>
</head>
<body>
{{inhalt}}
</body>
</html>
