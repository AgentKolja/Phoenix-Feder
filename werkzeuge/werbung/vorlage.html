<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Werbung Achtsamkeitsseminar</title>
<style>
@font-face { font-family: "Source Serif 4"; src: url("{{wurzel}}/schriften/source-serif-4.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "Source Serif 4"; src: url("{{wurzel}}/schriften/source-serif-4-italic.woff2") format("woff2"); font-weight: 200 900; font-style: italic; }
@font-face { font-family: "Source Sans 3"; src: url("{{wurzel}}/schriften/source-sans-3.woff2") format("woff2"); font-weight: 300 700; }
:root {
  --grund: #fbf7f1; --flaeche: #f3eadd; --text: #2a211c; --leise: #6b5b4f;
  --akzent: #8f5418; --akzent-hell: #c8842f; --linie: #e5d8c7;
  --serif: "Source Serif 4", Georgia, serif; --sans: "Source Sans 3", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--grund); color: var(--text); font-family: var(--sans); }
.blatt { position: relative; overflow: hidden; background: var(--grund); }
.oberzeile { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--akzent); }
h1 { font-family: var(--serif); font-weight: 500; line-height: 1.06; letter-spacing: -0.01em; }
h1, .unter, .fakt span, .szene p { text-wrap: balance; }
.text { text-wrap: pretty; }
.unter { font-family: var(--serif); color: var(--akzent); }
.text { color: var(--leise); line-height: 1.4; }
.fakten { display: grid; }
.fakt { display: grid; grid-template-columns: auto 1fr; align-items: baseline; }
.fakt b { color: var(--akzent); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.fakt span { color: var(--text); line-height: 1.3; }
.fakt span i { font-style: normal; color: var(--leise); }
.anmelden { display: flex; align-items: center; background: #fff; border: 1px solid var(--linie); }
.anmelden .qr svg, .anmelden .qr img { display: block; width: 100%; height: 100%; }
.anmelden strong { display: block; font-family: var(--serif); font-weight: 500; color: var(--text); }
.anmelden .adresse { color: var(--akzent); font-weight: 700; }
.leiter { display: flex; align-items: center; }
.leiter img { border-radius: 50%; object-fit: cover; object-position: 50% 25%; }
.leiter span { color: var(--leise); }
.leiter strong { color: var(--text); font-weight: 600; }
.bogen { overflow: hidden; border-radius: 999px 999px 28px 28px; box-shadow: 0 20px 60px rgb(60 40 20 / 18%); }
.bogen img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.marke { position: absolute; color: var(--akzent); font-family: var(--serif); }

/* ---------- Instagram-Beitrag 1080 × 1350 ---------- */
.post { width: 1080px; height: 1350px; padding: 70px 72px 64px; display: grid; grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: auto 1fr auto; column-gap: 50px; }
.post .bogen { grid-row: 1 / 3; height: 790px; }
.post .kopf { align-self: end; padding-bottom: 8px; }
.post .oberzeile { font-size: 20px; margin-bottom: 20px; }
.post h1 { font-size: 74px; }
.post .unter { font-size: 34px; margin-top: 18px; }
.post .rechts { align-self: start; padding-top: 26px; }
.post .text { font-size: 28px; }
.post .unten { grid-column: 1 / 3; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 36px; align-items: center; margin-top: 40px; padding-top: 36px; border-top: 2px solid var(--linie); }
.post .fakten { gap: 18px; }
.post .fakt { gap: 20px; font-size: 29px; }
.post .fakt b { font-size: 18px; width: 72px; }
.post .anmelden { flex-direction: column; gap: 10px; padding: 20px 22px 18px; border-radius: 28px; text-align: center; }
.post .qr { width: 176px; height: 176px; }
.post .anmelden strong { font-size: 28px; }
.post .anmelden .adresse { font-size: 19px; margin-top: 2px; }
.post .leiter { gap: 18px; margin-top: 30px; font-size: 24px; }
.post .leiter img { width: 74px; height: 74px; }

/* ---------- Story / WhatsApp-Status 1080 × 1920 ---------- */
.story { width: 1080px; height: 1920px; padding: 110px 90px 0; display: flex; flex-direction: column; }
.story .bogen { width: 560px; height: 640px; margin: 0 auto 52px; flex: none; }
.story .oberzeile { font-size: 26px; text-align: center; margin-bottom: 24px; }
.story h1 { font-size: 104px; text-align: center; }
.story .unter { font-size: 44px; text-align: center; margin-top: 26px; }
.story .fakten { margin: 48px auto 0; gap: 18px; }
.story .fakt { gap: 24px; font-size: 34px; }
.story .fakt b { font-size: 22px; width: 84px; }
.story .anmelden { margin: 52px auto 0; gap: 30px; padding: 24px 40px 24px 24px; border-radius: 34px; }
.story .qr { width: 220px; height: 220px; }
.story .anmelden strong { font-size: 46px; }
.story .anmelden .adresse { font-size: 30px; margin-top: 8px; }

/* ---------- Link-Vorschau 1200 × 630 (WhatsApp, Social Media) ---------- */
.vorschau { width: 1200px; height: 630px; padding: 50px 80px 50px 70px; display: grid; grid-template-columns: 400px 1fr; column-gap: 64px; align-items: center; }
.vorschau .bogen { height: 530px; }
.vorschau .oberzeile { font-size: 20px; margin-bottom: 18px; }
.vorschau h1 { font-size: 96px; }
.vorschau .unter { font-size: 38px; margin-top: 16px; }
.vorschau .leiter { gap: 16px; margin-top: 40px; font-size: 22px; }
.vorschau .leiter img { width: 64px; height: 64px; }

/* ---------- Plakat DIN A4: sehr wenig Text, sehr groß, ein Bild im Kreis ---------- */
@page { size: A4; margin: 0; }
.plakat { width: 210mm; height: 297mm; padding: 15mm 16mm 14mm; display: flex; flex-direction: column; background: #fffdf9; }
.plakat .kreis { position: absolute; width: 168mm; height: 168mm; right: -46mm; top: -62mm; border-radius: 50%; overflow: hidden; }
.plakat .kreis img { width: 100%; height: 100%; object-fit: cover; object-position: 62% 60%; }
.plakat > *:not(.kreis) { position: relative; }
.plakat h1 { margin-top: 94mm; font: 700 66pt/0.95 var(--sans); text-transform: uppercase; letter-spacing: -0.005em; text-wrap: initial; }
.plakat .unter { font-size: 46pt; margin-top: 6mm; line-height: 1.1; }
.plakat .unten { margin-top: auto; padding-top: 6mm; border-top: 0.8mm solid var(--text); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5mm 8mm; align-items: end; }
.plakat .termin { grid-column: 1 / -1; font: 600 34pt/1.15 var(--sans); color: var(--text); }
.plakat .infos { display: grid; gap: 4mm; font: 400 27pt/1.2 var(--sans); color: var(--text); }
.plakat .infos .klein { font-size: 15pt; color: var(--leise); margin-top: 2mm; }
.plakat .anmelden-qr { display: grid; justify-items: start; gap: 3mm; }
.plakat .qr { width: 44mm; height: 44mm; }
.plakat .anmelden-qr p { font: 400 15pt/1.3 var(--sans); color: var(--text); }
.plakat .anmelden-qr strong { font-size: 15pt; color: var(--akzent); }

/* ---------- Kurzvideo 1080 × 1920 (Reel, Story, Status) ---------- */
.reel { width: 1080px; height: 1920px; background: #1b1613; }
.reel .foto { position: absolute; inset: 0; animation: zoom 12s linear both; }
.reel .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.reel .schleier { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(27 22 19 / 10%) 0%, rgb(27 22 19 / 30%) 35%, rgb(27 22 19 / 85%) 80%); }
.reel .szene { position: absolute; left: 80px; right: 190px; bottom: 430px; color: #fff; opacity: 0; }
.reel .szene h1 { font-size: 112px; color: #fff; }
.reel .szene p { font-size: 44px; line-height: 1.35; margin-top: 26px; color: #f3eadd; }
.reel .s1 { animation: s1 12s linear both; }
.reel .s2 { animation: s2 12s linear both; }
.reel .s3 { animation: s3 12s linear both; }
.reel .s3 .oberzeile { color: #e3a55e; font-size: 30px; margin-bottom: 26px; }
.reel .ende { position: absolute; inset: 0; background: var(--grund); padding: 240px 80px 380px; justify-content: center; display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; animation: ende 12s linear both; }
.reel .ende .oberzeile { font-size: 30px; margin-bottom: 28px; }
.reel .ende h1 { font-size: 112px; }
.reel .ende .unter { font-size: 46px; margin-top: 26px; }
.reel .ende .fakten { margin: 64px auto 0; gap: 22px; text-align: left; }
.reel .ende .fakt { gap: 26px; font-size: 40px; }
.reel .ende .fakt b { font-size: 24px; width: 96px; }
.reel .ende .anmelden { margin-top: 70px; gap: 30px; padding: 24px 40px 24px 24px; border-radius: 34px; text-align: left; }
.reel .ende .qr { width: 270px; height: 270px; }
.reel .ende .anmelden strong { font-size: 46px; }
.reel .ende .anmelden .adresse { font-size: 30px; margin-top: 8px; }
@keyframes zoom { from { transform: scale(1.0); } to { transform: scale(1.14); } }
@keyframes s1 { 0% { opacity: 0; transform: translateY(30px); } 4% { opacity: 1; transform: none; } 24% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }
@keyframes s2 { 0%, 27% { opacity: 0; transform: translateY(30px); } 32% { opacity: 1; transform: none; } 50% { opacity: 1; } 54% { opacity: 0; } 100% { opacity: 0; } }
@keyframes s3 { 0%, 53% { opacity: 0; transform: translateY(30px); } 58% { opacity: 1; transform: none; } 70% { opacity: 1; } 74% { opacity: 0; } 100% { opacity: 0; } }
@keyframes ende { 0%, 72% { opacity: 0; } 77% { opacity: 1; } 100% { opacity: 1; } }
</style>
</head>
<body>
{{inhalt}}
</body>
</html>
